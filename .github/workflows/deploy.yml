name: Publicar en Cloudflare

# Cada vez que se sube algo a main: se prueba, se arma y se publica en Cloudflare Pages
# (https://mrwhiteburgers.com.ar). Para que publique hace falta UN secreto en este repo:
#   CLOUDFLARE_API_TOKEN  → token de Cloudflare con permiso "Cloudflare Pages: Edit"
# Mientras no esté, el flujo avisa y no publica (no falla).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: c73bcd61c0143db348dad80cbb171972
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisar el código
        run: npm run lint
      - name: Pruebas
        run: node --test src/lib/*.test.mjs server/*.test.mjs scripts/seo.test.mjs
      - name: Armar el sitio y el panel
        run: npm run build
      - name: Publicar en Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN en el repo: se armó todo bien pero NO se publicó."
            exit 0
          fi
          npx --yes wrangler@4 pages deploy dist --project-name mrwhiteburgers --branch main --commit-dirty=true
