<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <script>if (/^#\/?admin$/.test(location.hash)) location.replace('/panel/')</script>
    <link rel="icon" type="image/png" href="/favicon-burger.png" />
    <link rel="apple-touch-icon" href="/favicon-burger.png" />
    <link rel="preload" as="image" href="./videos/hero-poster.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./img/logo_full.webp" />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <!-- Tipografías: se bajan aparte y se aplican al llegar (con "swap" el texto se ve de entrada con una letra del sistema). Antes iban por @import dentro del CSS y frenaban el dibujado ~0,8 s. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500&display=swap" /></noscript>
    <!-- Foto de portada ya en el HTML: se ve antes de que cargue el JavaScript (React la reemplaza al arrancar) -->
    <style>
      #hero-estatico{position:relative;min-height:675px;background:#000;overflow:hidden}
      #hero-estatico img{position:absolute;top:0;left:0;width:100%;height:380px;object-fit:cover;object-position:50% 30%}
      @media (min-width:768px){#hero-estatico{min-height:100vh}#hero-estatico img{left:45%;width:55%;height:100%;object-position:50% 35%}}
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SEO_TITULO%</title>
    <meta name="description" content="%SEO_DESCRIPCION%" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Zona: ayuda a los buscadores a ubicar el negocio -->
    <meta name="geo.region" content="AR-B" />
    <meta name="geo.placename" content="La Plata, Buenos Aires" />

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Facebook, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Mr. White Burgers" />
    <meta property="og:title" content="%SEO_TITULO%" />
    <meta property="og:description" content="Smash burgers en La Plata. Armá tu pedido y mandalo por WhatsApp." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mr. White Burgers: smash burger con cheddar y botón Pedí por WhatsApp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITULO%" />
    <meta name="twitter:description" content="Smash burgers en La Plata. Armá tu pedido y mandalo por WhatsApp." />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />

    <!-- Datos del negocio, carta, horarios y preguntas para Google: se generan al armar la web (scripts/seo.mjs) -->
    <!--SEO_JSONLD-->
  </head>
  <body>
    <div id="root"><div id="hero-estatico"><img src="./videos/hero-poster.webp" alt="" width="900" height="820" fetchpriority="high" decoding="async" /></div></div>
    <!--SEO_NOSCRIPT-->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
