<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <script>if (/^#\/?admin$/.test(location.hash)) location.replace('/panel/')</script>
    <link rel="icon" type="image/png" href="/favicon-burger.png" />
    <link rel="apple-touch-icon" href="/favicon-burger.png" />
    <link rel="preload" as="image" href="./videos/hero-poster.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./img/logo_full.webp" />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SEO_TITULO%</title>
    <meta name="description" content="%SEO_DESCRIPCION%" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Zona: ayuda a los buscadores a ubicar el negocio -->
    <meta name="geo.region" content="AR-B" />
    <meta name="geo.placename" content="La Plata, Buenos Aires" />

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Facebook, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Mr. White Burgers" />
    <meta property="og:title" content="%SEO_TITULO%" />
    <meta property="og:description" content="Smash burgers en La Plata. Armá tu pedido y mandalo por WhatsApp." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mr. White Burgers: smash burger con cheddar y botón Pedí por WhatsApp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_TITULO%" />
    <meta name="twitter:description" content="Smash burgers en La Plata. Armá tu pedido y mandalo por WhatsApp." />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />

    <!-- Datos del negocio, carta, horarios y preguntas para Google: se generan al armar la web (scripts/seo.mjs) -->
    <!--SEO_JSONLD-->
  </head>
  <body>
    <div id="root"></div>
    <!--SEO_NOSCRIPT-->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
